name: vortex-board

networks:
  coolify:
    external: true

# Same named volume the vortex-line project mounts: the confirmation-call
# queue is a JSON file written HERE (wall cancel buttons, pathway test-fire)
# and drained by the line container's ConfirmationWorker. Without sharing it,
# wall-cancelled visits never reach the dial step.

volumes:
  vortex-logs:
    name: vortex-logs

services:
  board:
    build:
      context: ..
      dockerfile: Dockerfile.board
    image: vortex-board:local
    container_name: vortex-board
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VORTEX_ENV: production
      VORTEX_BOARD_PORT: "8080"
      # The line runs as its own container on the same network. Without this
      # the board cannot reach it for health and live calls.
      VORTEX_LINE_URL: http://vortex-line:7860
      # The store: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY come through
      # env_file above (an entry here would win over it, so they are not
      # repeated). The board reads call events and the product tables from the
      # same Supabase project the line writes, and the wall's Horarios cancel
      # buttons write wall_cancellations rows straight back to it. No volume:
      # the two containers share one database, not a mounted file.
    # Run as the line's uid (10001, see deploy/Dockerfile): the shared
    # vortex-logs volume is initialised from the line image, so the queue
    # file and directory belong to 10001. The board image's own vortex user
    # is 1001 and could not write the shared queue (test-fire returned 500).
    # Everything else the board touches is read-only or lives in that volume.
    user: "10001"
    volumes:
      - vortex-logs:/app/logs
    networks:
      - coolify
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.vortex-gzip.compress=true
      - traefik.http.middlewares.vortex-https.redirectscheme.scheme=https
      - traefik.http.middlewares.vortex-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.vortex-headers.headers.framedeny=true
      - traefik.http.middlewares.vortex-headers.headers.browserxssfilter=true
      - traefik.http.middlewares.vortex-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.vortex-headers.headers.referrerpolicy=no-referrer
      - traefik.http.routers.vortex-sslip-http.rule=Host(`vortex.167.233.80.47.sslip.io`)
      - traefik.http.routers.vortex-sslip-http.entrypoints=http
      - traefik.http.routers.vortex-sslip-http.middlewares=vortex-https
      - traefik.http.routers.vortex-sslip-http.service=vortex-board
      - traefik.http.routers.vortex-sslip-https.rule=Host(`vortex.167.233.80.47.sslip.io`)
      - traefik.http.routers.vortex-sslip-https.entrypoints=https
      - traefik.http.routers.vortex-sslip-https.tls=true
      - traefik.http.routers.vortex-sslip-https.tls.certresolver=letsencrypt
      - traefik.http.routers.vortex-sslip-https.middlewares=vortex-gzip,vortex-headers
      - traefik.http.routers.vortex-sslip-https.service=vortex-board
      - traefik.http.services.vortex-board.loadbalancer.server.port=8080

# No volumes. The board keeps nothing of its own: every row it reads and every
# row the Horarios cancel buttons write lives in Supabase/Postgres.
