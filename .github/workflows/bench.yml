# The model bench: every candidate model on the same scenarios, one matrix,
# persisted on the bench-results branch and shown at
# https://jferreiros.github.io/vortex/bench.html
#
# It spends provider keys, so it never runs on a pull request. It runs on a
# schedule, by hand, and when main changes the prompt, the tools or the bench.
# Without any provider secret every model is skipped and the job still
# publishes a run that says so. Docs: docs/evals.md, "Layer 5".

name: bench

on:
  workflow_dispatch:
    inputs:
      models:
        description: "comma-separated provider/model ids (empty = catalogue defaults)"
        required: false
        default: ""
      repeat:
        description: "runs per scenario (pass^k)"
        required: false
        default: "1"
      only:
        description: "substring filter on scenario ids"
        required: false
        default: ""
      max_eur:
        description: "refuse a run estimated above this, at list price"
        required: false
        default: "1.00"
  schedule:
    # Every six hours during the event weekend. Delete after 2026-09-20.
    - cron: "15 */6 * * *"
  push:
    branches: [main]
    paths:
      - "vortex/conversation/**"
      - "vortex/tools.py"
      - "vortex/contract.py"
      - "vortex/models.py"
      - "evals/conversation/**"
      - "evals/bench/**"

# One bench at a time: two runs publishing together would race on the branch
# (the publisher retries, but there is no point in running twice).
concurrency:
  group: bench
  cancel-in-progress: false

permissions:
  contents: write

env:
  UV_LOCKED: "1"

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make install
      - name: Run the bench
        id: bench
        env:
          HELMCODE_API_KEY: ${{ secrets.HELMCODE_API_KEY }}
          VERCEL_AI_GATEWAY_KEY: ${{ secrets.VERCEL_AI_GATEWAY_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODELS: ${{ github.event.inputs.models }}
          K: ${{ github.event.inputs.repeat || '1' }}
          ONLY: ${{ github.event.inputs.only }}
          MAX_EUR: ${{ github.event.inputs.max_eur || '1.00' }}
        run: |
          if [ -z "$HELMCODE_API_KEY$VERCEL_AI_GATEWAY_KEY$CLOUDFLARE_API_TOKEN$OPENAI_API_KEY" ]; then
            echo "No provider secret is set; nothing to bench. Add HELMCODE_API_KEY under Settings > Secrets." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          make bench
      - name: Job summary
        if: always() && steps.bench.outputs.ran == 'true'
        run: |
          if [ -f evals/results/summary.md ]; then
            cat evals/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No evals/results/summary.md — the bench did not write a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the report
        if: always() && steps.bench.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            evals/results/summary.md
            evals/results/summary.json
            evals/results/report.html
            evals/results/bench/latest.json
          if-no-files-found: ignore
      - name: Publish to the bench-results branch
        if: always() && steps.bench.outputs.ran == 'true'
        run: |
          git config user.name "vortex-bench[bot]"
          git config user.email "vortex-bench@users.noreply.github.com"
          make bench-publish
      - name: Discord
        # Discord has refused Actions runner IPs before (docs/ci.md). Best effort.
        if: always() && steps.bench.outputs.ran == 'true' && steps.bench.outcome == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "no DISCORD_WEBHOOK_URL secret; skip"; exit 0; fi
          make bench-discord || echo "Discord refused the post; run make bench-discord from a laptop or the VPS"
