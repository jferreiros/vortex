# Continuous deployment. Every push to main (a merged PR) redeploys the line
# and the board on the Hetzner box over SSH and runs deploy/deploy-both.sh
# there: pull, build, migrate, restart, verify, Discord.
#
# Secrets: DEPLOY_SSH_KEY (private key whose public half is in the box's
# authorized_keys), DEPLOY_HOST (user@host). The box pulls the private repo
# with this job's own GITHUB_TOKEN, passed for the duration of the run through
# git's environment config, so no long-lived GitHub credential lives on the box.
# Docs: deploy/README.md, section "Deploy".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-both on the box
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH key and pinned host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '# 2.28.66.152:22 SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.19' >> ~/.ssh/known_hosts

      - name: Run deploy/deploy-both.sh on the box
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_HOST" \
            "export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ${AUTH}'; \
             cd /root/vortex && deploy/deploy-both.sh --force"
