name: discord

on:
  pull_request:
    types: [opened, closed, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      message:
        description: Manual ping to the team channel
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          MANUAL: ${{ github.event.inputs.message }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set. Skip."
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            export BODY="$MANUAL"
          else
            export BODY="**PR ${ACTION}** ${TITLE} · ${URL} · ${ACTOR}"
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ["DISCORD_WEBHOOK_URL"]
          body = os.environ["BODY"][:1900]
          req = urllib.request.Request(
              url,
              data=json.dumps({"content": body}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          urllib.request.urlopen(req, timeout=15)
          PY
