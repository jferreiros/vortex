# Rules lane: what the clinic refuses, provider matching, nearest site.
# Sources: clinic-rules "Providers" / "Age" / "Insurance", problems 3, 6, 15, 17.
group: rules
now: "2026-09-18T09:00:00+02:00"

cases:
  # ---- find_provider: near-miss pairs, leave, unknown ----------------------
  - id: rules.provider.saez_is_the_gp
    problem: 3
    tool: find_provider
    args: {spoken_name: "doctor Sáez"}
    expect:
      $one_of:
        - {status: found, provider: {provider_id: PR02}}
        - {status: ambiguous, candidates: {$contains: {provider_id: PR02}}}

  - id: rules.provider.saenz_is_the_paediatrician
    problem: 3
    tool: find_provider
    args: {spoken_name: "doctora Sáenz", specialty_id: paediatrics}
    expect: {status: found, provider: {provider_id: PR03}}

  - id: rules.provider.saez_without_accent_is_ambiguous_or_found
    problem: 3
    tool: find_provider
    args: {spoken_name: "Saez"}
    expect:
      $one_of:
        - {status: ambiguous, candidates: {$min_len: 2}}
        - {status: found, provider: {provider_id: PR02}}

  - id: rules.provider.iglesias_vs_iglesia_split_by_specialty
    problem: 3
    tool: find_provider
    args: {spoken_name: "Iglesia", specialty_id: orthopaedics}
    expect: {status: found, provider: {provider_id: PR05}}

  - id: rules.provider.requena_is_on_leave
    problem: 3
    tool: find_provider
    args: {spoken_name: "Dr. Requena"}
    expect: {status: on_leave, provider: {provider_id: PR07}, rejection: {reason: provider_on_leave}}

  - id: rules.provider.unknown_doctor_not_found
    problem: 3
    tool: find_provider
    # doctor_and_site-570e40a3f718: the public roster's doctor nobody has.
    args: {spoken_name: "doctor Fuentes"}
    expect: {status: not_found, rejection: {reason: provider_not_found}}

  - id: rules.provider.alvaro_cid_is_the_physio_with_his_title
    problem: 3
    tool: find_provider
    args: {spoken_name: "Álvaro Cid"}
    expect: {status: found, provider: {provider_id: PR06, name: "D. Álvaro Cid"}}

  # ---- check_eligibility: age, referral, the insurance matrix --------------
  # Each of these carries the ``from_number`` the patient would be calling
  # from. It is not decoration: ``/directory`` has no lookup by id, so a bare
  # ``patient_id`` with no call behind it cannot be placed, and the rules that
  # read the record (age, referral, allowance) have nothing to read. On a real
  # call identity has already fetched the record and left it on the context;
  # here the line is what stands in for it. A case run without one exercises
  # the missing-record path instead, which is what live behaviour was before
  # the lookup was fixed.
  - id: rules.age.child_cannot_book_general_practice
    problem: 6
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00107, specialty_id: general_practice}
    expect: {allowed: false, rejection: {reason: not_eligible_age}}

  - id: rules.age.child_books_paediatrics
    problem: 10
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00107, specialty_id: paediatrics}
    expect: {allowed: true, rejection: {$absent: true}}

  - id: rules.age.adult_cannot_book_paediatrics
    problem: 6
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: paediatrics}
    expect: {allowed: false, rejection: {reason: not_eligible_age}}

  - id: rules.referral.dermatology_without_referral
    problem: 6
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: dermatology}
    expect: {allowed: false, rejection: {reason: referral_required}}

  - id: rules.referral.dermatology_with_referral_but_dkv_refused_by_iglesias
    problem: 6
    tool: check_eligibility
    from_number: "+34655555555"
    # Antonio holds the referral and DKV. Dra. Iglesias refuses DKV: a redirect, not a refusal.
    args: {patient_id: P00200, specialty_id: dermatology, provider_id: PR04}
    expect: {allowed: false, rejection: {reason: provider_not_in_network}}

  - id: rules.insurance.control_case_books_normally
    problem: 6
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: general_practice, provider_id: PR01, insurer: sanitas}
    expect: {allowed: true}

  - id: rules.insurance.adeslas_covers_no_gynaecology
    problem: 6
    tool: check_eligibility
    from_number: "+34699000111"
    args: {patient_id: P00043, specialty_id: gynaecology, insurer: adeslas}
    expect: {allowed: false, rejection: {reason: specialty_not_covered}}

  - id: rules.insurance.asisa_physio_only_where_there_is_no_physio
    problem: 6
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: physiotherapy, location_id: sur, insurer: asisa}
    expect: {allowed: false, rejection: {reason: location_not_covered}}

  - id: rules.insurance.second_policy_unlocks_the_booking
    problem: 17
    tool: check_eligibility
    from_number: "+34655555555"
    # DKV is refused by the dermatologist; naming Sanitas as the plan makes it bookable.
    args: {patient_id: P00200, specialty_id: dermatology, provider_id: PR04, insurer: sanitas}
    expect: {allowed: true}

  - id: rules.insurance.privado_is_never_a_fallback
    problem: 6
    tool: check_eligibility
    from_number: "+34699000111"
    # Marta holds Sanitas only. Quoting self-pay for her is inventing a plan.
    args: {patient_id: P00043, specialty_id: gynaecology, insurer: privado}
    expect: {allowed: false}

  # ---- nearest_location: needs a geocoder; fails offline until the lane
  #      ships one (or a fixture table). Kept so the gap is visible. ----------
  - id: rules.nearest.getafe_address_goes_to_sur
    problem: 15
    tags: [needs-geocoder]
    tool: nearest_location
    args: {address: "Calle de Madrid 54, Getafe", specialty_id: orthopaedics}
    expect: {location_id: sur}

  - id: rules.nearest.castellana_goes_to_norte
    problem: 15
    tags: [needs-geocoder]
    tool: nearest_location
    args: {address: "Paseo de la Castellana 180, Madrid", specialty_id: general_practice}
    expect: {location_id: norte}

  - id: rules.nearest.closest_site_without_the_specialty_is_skipped
    problem: 15
    tags: [needs-geocoder]
    tool: nearest_location
    # Physiotherapy sits only at Sur; a caller next to Centro still goes to Sur.
    args: {address: "Calle del Arenal 3, Madrid", specialty_id: physiotherapy}
    expect: {location_id: sur}

  # ---- problem 17: the second policy is not in the API --------------------
  - id: rules.second_policy.refusal_names_a_plan_rule_so_the_call_can_ask
    problem: 17
    # The five insurance reasons are the cue to ask for a second policy. This
    # one must be one of them, never a bare no_availability.
    tool: check_eligibility
    from_number: "+34699000111"
    args: {patient_id: P00043, specialty_id: gynaecology}
    expect:
      allowed: false
      rejection:
        reason:
          $in: [specialty_not_covered, location_not_covered, provider_not_in_network,
                insurer_referral_required, allowance_exhausted]

  - id: rules.second_policy.control_first_plan_already_works
    problem: 17
    # Marta's own plan covers this. Naming a second one must not be needed,
    # and the verdict must not be a refusal waiting for one.
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: general_practice, insurer: sanitas}
    expect: {allowed: true, rejection: {$absent: true}}

  # ---- redirects: a refusal that has somewhere to go ----------------------
  - id: rules.redirect.age_refusal_points_at_the_right_specialty
    problem: 6
    # The child case is a redirect, not a dead end: paediatrics can see him.
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00107, specialty_id: general_practice}
    expect:
      allowed: false
      rejection: {reason: not_eligible_age}
      redirect_to: {$contains: {provider_id: PR03, specialty_id: paediatrics}}

  - id: rules.redirect.provider_on_leave_offers_the_rest_of_his_site
    problem: 3
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: general_practice, provider_id: PR07}
    expect:
      allowed: false
      rejection: {reason: provider_on_leave}
      redirect_to: {$contains: {provider_id: PR02}}

  # ---- the fearful agent: these must NOT be refused -----------------------
  - id: rules.control.adult_books_general_practice_at_any_site
    problem: 6
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: general_practice}
    expect: {allowed: true, rejection: {$absent: true}}

  - id: rules.control.referral_holder_books_the_specialty_that_needs_one
    problem: 6
    # Antonio holds the dermatology referral. Quoting a plan the dermatologist
    # takes leaves nothing to refuse.
    tool: check_eligibility
    from_number: "+34655555555"
    args: {patient_id: P00200, specialty_id: dermatology, insurer: sanitas}
    expect: {allowed: true, rejection: {$absent: true}}

  - id: rules.control.asisa_physio_at_a_covered_site_is_only_a_missing_physio
    problem: 6
    # ASISA covers Centro. No physiotherapist sits there, so this is an empty
    # calendar, not an insurance refusal.
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: physiotherapy, location_id: centro, insurer: asisa}
    expect: {allowed: false, rejection: {reason: no_availability}}

  - id: rules.control.unknown_plan_is_not_a_refusal
    problem: 17
    # The catalogue has ten plans; the fixtures have five. A plan we do not
    # hold a record for must not be turned into a refusal we invented.
    tool: check_eligibility
    from_number: "+34612345678"
    args: {patient_id: P00042, specialty_id: general_practice, insurer: mapfre}
    expect: {allowed: true}

  # ---- nearest site: the address does not have to be a site's own ---------
  - id: rules.nearest.alcobendas_is_nearer_norte
    problem: 15
    tags: [needs-geocoder]
    tool: nearest_location
    args: {address: "Avenida de España 12, Alcobendas", specialty_id: general_practice}
    expect: {location_id: norte}

  - id: rules.nearest.lavapies_is_nearer_centro
    problem: 15
    tags: [needs-geocoder]
    tool: nearest_location
    args: {address: "Calle de Argumosa 20, Lavapiés, Madrid", specialty_id: general_practice}
    expect: {location_id: centro}

  - id: rules.nearest.an_address_nobody_can_place_is_asked_about
    problem: 15
    # Never a silent wrong site: an unplaceable address is a question.
    tool: nearest_location
    args: {address: "12 Privet Drive, Little Whinging", specialty_id: general_practice}
    expect: {location_id: {$absent: true}, rejection: {reason: out_of_scope}}
