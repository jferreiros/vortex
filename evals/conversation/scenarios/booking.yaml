# Problems 1, 3, 5, 7: bookings that hinge on one hard thing. Problem 11 lives in languages.yaml.
# The call connects Friday 18 September 2026, 09:00 Europe/Madrid.
group: booking
now: "2026-09-18T09:00:00+02:00"

scenarios:
  - id: p1.simple_booking_name_and_phone
    problem: 1
    from_number: "+34612345678"
    caller:
      - says: "Hola, buenos días. Soy Marta Ruiz López, quería pedir cita con medicina general lo antes posible."
        means: {identify: {name: "Marta Ruiz López"}, request: {intent: book, specialty_id: general_practice}}
      - says: "Sí, mi teléfono es el seis uno dos, tres cuatro cinco, seis siete ocho."
        means: {identify: {phone: "612345678"}}
      - says: "Perfecto, la primera que tenga me va bien."
        means: {accept: true}
    expect:
      actions:
        - kind: book
          patient_id: P00042
          appointment_type_id: review
          provider_id: {$earliest_slot: {specialty_id: general_practice, patient_id: P00042, field: provider_id}}
          slot: {$earliest_slot: {specialty_id: general_practice, patient_id: P00042}}
          policy_id: sanitas
      trajectory_contains: [find_patient, find_slots, prepare_booking, submit_action]
      must_not_call: [build_registration, prepare_cancel]
      privacy_of: [P00042]
      max_tool_calls: 12

  - id: p1.morning_at_norte_by_dni
    problem: 1
    caller:
      - says: "Buenos días, llamo para una cita de medicina general en Arenal Norte, el lunes por la mañana si puede ser."
        means: {request: {intent: book, specialty_id: general_practice, location_id: norte, when: "this coming Monday", part_of_day: morning}}
      - says: "Soy Marta Ruiz, con DNI uno dos tres cuatro cinco seis siete ocho zeta."
        means: {identify: {name: "Marta Ruiz", national_id: "12345678Z"}}
      - says: "Vale, esa me viene bien."
        means: {accept: true}
    expect:
      actions:
        - kind: book
          patient_id: P00042
          location_id: norte
          slot: {$earliest_slot: {specialty_id: general_practice, location_id: norte, "on": "2026-09-21", part_of_day: morning, patient_id: P00042}}
      privacy_of: [P00042]

  # ---- problem 3, one scenario per published doctor_and_site case -----------
  # Source: evals/corpus/cases/public-cases.json, problem_id doctor_and_site.
  # The published cases' own ids (patients, providers, sites) belong to the
  # platform's world, not our fixtures, so each is re-cast onto our own
  # patients and providers while keeping the trap the case tests.

  - id: p3.provider_and_site_both_named_match
    problem: 3
    # doctor_and_site-2fe62ca2872f: usual doctor, usual site, both correct
    # together -- the doctor really does sit there, so there is nothing to
    # redirect. Marta Ruiz's own record already says Dra. Ortiz at Centro.
    caller:
      - says: "Hola, buenos días. Soy Marta Ruiz, nacida el doce de marzo del ochenta y cinco. Quiero cita con la doctora Ortiz en Arenal Centro, la de siempre. Se me está acabando la receta y necesito que me la renueve."
        means: {identify: {name: "Marta Ruiz", date_of_birth: "1985-03-12"}, request: {intent: book, provider: "doctora Ortiz", location_id: centro}}
      - says: "Vale, esa me viene bien. Gracias."
        means: {accept: true}
    expect:
      actions:
        - kind: book
          patient_id: P00042
          provider_id: PR01
          location_id: centro
          appointment_type_id: review
          slot: {$earliest_slot: {provider_id: PR01, patient_id: P00042}}
          policy_id: sanitas
      trajectory_contains: [find_patient, find_provider, find_slots, prepare_booking, submit_action]
      privacy_of: [P00042]

  - id: p3.surname_near_miss_gp_not_paediatrician
    problem: 3
    # doctor_and_site-057078bb5b44: caller knows the surname and the kind of
    # doctor, not that a near-miss surname exists at the clinic. "Sáez" (GP)
    # must not resolve to "Sáenz" (paediatrics) just because they sound alike.
    caller:
      - says: "Buenos días. Soy Marta Ruiz, nacida el doce de marzo del ochenta y cinco. Quería cita con el doctor Sáez, el de medicina general. Tengo la tensión alta."
        means: {identify: {name: "Marta Ruiz", date_of_birth: "1985-03-12"}, request: {intent: book, provider: "doctor Sáez", specialty_id: general_practice}}
      - says: "Sí, el doctor Sáez, el de medicina general. No la pediatra. La primera que tenga con él."
        means: {accept: true}
    expect:
      actions:
        - kind: book
          patient_id: P00042
          provider_id: PR02
          location_id: norte
          appointment_type_id: review
          slot: {$earliest_slot: {provider_id: PR02, patient_id: P00042}}
          policy_id: sanitas
      trajectory_contains: [find_patient, find_provider, find_slots, prepare_booking, submit_action]
      privacy_of: [P00042]

  - id: p3.named_doctor_on_leave_redirects_within_specialty_at_same_site
    problem: 3
    # doctor_and_site-d5b4f04886c5: told the named doctor is away, the caller
    # explicitly asks for the earliest slot with a colleague of the same kind
    # at the same site, and accepts the first one offered. A named site plus
    # an explicit ask for an alternative there is a booking to make, not a
    # bare refusal: Norte's only other GP is Sáez.
    caller:
      - says: "Buenos días. Soy Marta Ruiz, nacida el doce de marzo del ochenta y cinco. Quiero cita con el doctor Requena, en Arenal Norte. Llevo un par de meses durmiendo mal."
        means: {identify: {name: "Marta Ruiz", date_of_birth: "1985-03-12"}, request: {intent: book, provider: "doctor Requena", location_id: norte}}
      - says: "Ah, vale, no pasa nada. Pues la primera cita que tengan ahí en Norte, con cualquier otro médico de medicina general."
        means: {request: {intent: book, specialty_id: general_practice, location_id: norte}, accept: true}
    expect:
      actions:
        - kind: book
          patient_id: P00042
          provider_id: PR02
          location_id: norte
          appointment_type_id: review
          slot: {$earliest_slot: {provider_id: PR02, patient_id: P00042}}
          policy_id: sanitas
      trajectory_contains: [find_patient, find_provider, find_slots, prepare_booking, submit_action]
      must_not_call: [prepare_cancel]
      privacy_of: [P00042]

  - id: p3.provider_and_site_fixed_day_dropped
    problem: 3
    # doctor_and_site-9904a6d96cdd: doctor and site matter far more than the
    # day the caller guessed at. Our fixtures give every provider one site
    # open every weekday, so there is no weekday the provider is simply not
    # there; the equivalent trap here is a site closed on the guessed day
    # (Sur never opens Saturday). Provider and site stay fixed; the day does
    # not. Never seen before, so a first visit.
    caller:
      - says: "Hola, soy Marta Ruiz García. Quiero cita con el doctor Iglesia, el traumatólogo, en Arenal Sur. Había pensado venir el sábado. Me duele la rodilla desde hace semanas."
        means: {identify: {name: "Marta Ruiz García"}, request: {intent: book, provider: "doctor Iglesia", specialty_id: orthopaedics, location_id: sur, when: Saturday}}
      - says: "Nací el dos de noviembre de mil novecientos noventa y dos."
        means: {identify: {date_of_birth: "1992-11-02"}}
      - says: "¿Cerrado el sábado en Sur? Vale, no importa el día. La primera que tengan con él ahí, cualquier día."
        means: {request: {intent: book, provider: "doctor Iglesia", specialty_id: orthopaedics, location_id: sur}, accept: true}
    expect:
      actions:
        - kind: book
          patient_id: P00043
          provider_id: PR05
          location_id: sur
          appointment_type_id: first_visit
          slot: {$earliest_slot: {provider_id: PR05, patient_id: P00043}}
          policy_id: adeslas
      trajectory_contains: [find_patient, find_provider, find_slots, prepare_booking, submit_action]
      privacy_of: [P00043]

  - id: p3.provider_not_found_is_never_invented
    problem: 3
    # doctor_and_site-570e40a3f718: the named doctor does not exist, and the
    # caller will see nobody else -- spells the surname once, then declines
    # any alternative. The only honest answer is the rule that bit, never a
    # booking made up to have something to submit.
    caller:
      - says: "Buenos días. Soy Antonio Pérez Martín, con NIE equis uno dos tres cuatro cinco seis siete ele. Quería cita con el doctor Fuentes, el traumatólogo. Me duele la rodilla después de caminar un rato, desde hace semanas."
        means: {identify: {name: "Antonio Pérez Martín", national_id: "X1234567L"}, request: {intent: book, provider: "doctor Fuentes", specialty_id: orthopaedics}}
      - says: "Fuentes. Efe, u, e, n, t, e, s."
        means: {request: {provider: "doctor Fuentes"}}
      - says: "Ya veo. Pues nada, solo quería con él. Gracias, adiós."
        means: {decline: true, end: true}
    expect:
      actions:
        - {kind: no-action, reason: provider_not_found}
      must_not_call: [prepare_booking]
      privacy_of: [P00200]

  - id: p5.first_thing_monday_12_october_moves_to_tuesday
    problem: 5
    caller:
      - says: "Soy Marta Ruiz, doce del tres del ochenta y cinco. Necesito medicina general a primera hora del lunes doce de octubre."
        means: {identify: {name: "Marta Ruiz", date_of_birth: "1985-03-12"}, request: {intent: book, specialty_id: general_practice, when: "first thing on Monday the twelfth of October", part_of_day: morning}}
      - says: "Si está cerrado, pues el siguiente día que abran, a primera hora."
        means: {accept: true}
    expect:
      actions:
        - kind: book
          patient_id: P00042
          slot: {$earliest_slot: {specialty_id: general_practice, "on": "2026-10-13", part_of_day: morning, patient_id: P00042}}
      privacy_of: [P00042]

  # ---- problem 7: the asked window is empty; negotiate the nearest -----------

  - id: p7.empty_afternoon_takes_the_nearest_morning
    problem: 7
    # Sur shuts Friday lunchtime, so a Friday afternoon of orthopaedics there is
    # empty with nobody blocked. The nearest thing that keeps specialty and site
    # is that same Friday morning; the caller takes it. Booked, not refused.
    caller:
      - says: "Hola, soy Marta Ruiz, doce de marzo del ochenta y cinco. Quería cita de traumatología en Arenal Sur el viernes que viene por la tarde."
        means: {identify: {name: "Marta Ruiz", date_of_birth: "1985-03-12"}, request: {intent: book, specialty_id: orthopaedics, location_id: sur, when: "this coming Friday", part_of_day: afternoon}}
      - says: "¿Por la tarde no hay nada? Vale, pues ese mismo viernes por la mañana me apaño."
        means: {accept: true}
    expect:
      actions:
        - kind: book
          patient_id: P00042
          provider_id: PR05
          location_id: sur
          appointment_type_id: review
          slot: {$earliest_slot: {provider_id: PR05, location_id: sur, "on": "2026-09-25", part_of_day: morning, patient_id: P00042}}
          policy_id: sanitas
      trajectory_contains: [find_patient, resolve_date, find_slots, prepare_booking, submit_action]
      privacy_of: [P00042]
