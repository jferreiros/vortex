[project]
name = "vortex"
version = "0.1.0"
description = "Vortex - voice agent that answers a clinic's scheduling calls (HackSpain 2026, Prosper AI track)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.1",
    "httpx>=0.27",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pipecat-ai[deepgram,websocket]>=1.11,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vortex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
