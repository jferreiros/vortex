[project]
name = "vortex"
version = "0.1.0"
description = "Vortex - voice agent that answers a clinic's scheduling calls (HackSpain 2026, Prosper AI track)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.1",
    "httpx>=0.27",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pipecat-ai[soniox,elevenlabs,websocket,aic]>=1.11,<2",
    "nicegui>=2.22",
    "langfuse>=4.15.4",
    "email-validator>=2.3.0",
    "phonenumbers>=9.0.39",
    "tzdata>=2026.4",
    "psycopg[binary]>=3.2",
]


[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vortex"]

[tool.hatch.build.targets.wheel.force-include]
"vortex/observability/board.css" = "vortex/observability/board.css"
"vortex/observability/design.css" = "vortex/observability/design.css"
"vortex/observability/live.css" = "vortex/observability/live.css"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# nicegui.testing.User loads this file to register the console pages.
main_file = "vortex/observability/live.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixture and docstring text mirrors the real platform's literal wire format,
# en dash included ("09:00–20:00") - not a typo.
"vortex/clinic/fixtures.py" = ["RUF001"]
"vortex/contract.py" = ["RUF002"]
# Word lists read better as prose than as quoted list literals; the curly
# apostrophe is normalized STT input, not a typo.
"vortex/conversation/language.py" = ["RUF001", "SIM905"]
# Lazy-singleton-with-test-reset: `global` is the standard shape for this.
"vortex/settings.py" = ["PLW0603"]
