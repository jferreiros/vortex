  <style type="text/css">@keyframes robot-entrance { 0% { opacity: 0; transform: translateY(35px) scale(0.3, 0.4); } 35% { opacity: 1; transform: translateY(-8px) scale(1.04, 1.08); } 55% { transform: translateY(3px) scale(0.98, 0.96); } 75% { transform: translateY(-2px) scale(1.02, 1.01); } 90% { transform: translateY(1px) scale(0.99, 0.995); } 100% { opacity: 1; transform: translateY(0) scale(1, 1); } } @keyframes shadow-entrance { 0% { opacity: 0; transform: scale(0.2); } 35% { opacity: 0.9; transform: scale(1.12); } 55% { opacity: 0.7; transform: scale(0.96); } 75% { opacity: 0.85; transform: scale(1.02); } 100% { opacity: 1; transform: scale(1); } } @keyframes clipboard-inertia { 0%, 30% { transform: rotate(0deg); } 48% { transform: rotate(5deg); } 68% { transform: rotate(-2deg); } 84% { transform: rotate(1deg); } 100% { transform: rotate(0deg); } } @keyframes eyes-activate { 0%, 40% { opacity: 0; transform: scale(0); } 45% { opacity: 1; transform: scale(0.2); } 65% { opacity: 1; transform: scale(1.25); } 80% { transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } } .anim-robot { transform-origin: 125px 210px; animation: robot-entrance 1.2s cubic-bezier(0.25, 1, 0.5, 1) both; } .anim-shadow { transform-origin: 125px 224px; animation: shadow-entrance 1.2s cubic-bezier(0.25, 1, 0.5, 1) both; } .anim-clipboard { transform-origin: 65px 135px; animation: clipboard-inertia 1.2s cubic-bezier(0.33, 1, 0.68, 1) both; } .anim-eyes { transform-origin: 114px 80px; animation: eyes-activate 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both; }</style>
