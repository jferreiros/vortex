<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="59.87 13.32 125.3 125.3" fill="none">
  <!-- Vorty accessory: call-center headset, band over the crown, boom mic toward the mouth -->
  <g id="accessory-headset">
    <path d="m70 55c6-24 29-38 53-38s47 14 53 38" stroke="url(#hs-band)" stroke-linecap="round" stroke-width="6" fill="none"/>
    <ellipse cx="70" cy="72" rx="8" ry="17" fill="url(#hs-cup)"/>
    <ellipse cx="176" cy="72" rx="8" ry="17" fill="url(#hs-cup)"/>
    <path d="m173 86c-4 10-14 18-24 22" stroke="#1B1B1B" stroke-linecap="round" stroke-width="4" fill="none"/>
    <circle cx="149" cy="109" r="5" fill="url(#hs-mic)"/>
  </g>
  <defs>
    <linearGradient id="hs-band" x1="123" x2="123" y1="17" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A3A3A" offset="0"/>
      <stop stop-color="#111" offset="1"/>
    </linearGradient>
    <linearGradient id="hs-cup" x1="0" x2="0" y1="55" y2="89" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E2E2E" offset="0"/>
      <stop stop-color="#0A0A0A" offset="1"/>
    </linearGradient>
    <radialGradient id="hs-mic" cx="0" cy="0" r="1" gradientTransform="translate(149 109) scale(6)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37784B" offset="0"/>
      <stop stop-color="#183828" offset="1"/>
    </radialGradient>
  </defs>
</svg>
